name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: am-hook.exe
            asset_name: am-hook-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: am-hook
            asset_name: am-hook-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: am-hook
            asset_name: am-hook-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: am-hook
            asset_name: am-hook-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp am-hook.exe ../../../${{ matrix.asset_name }}
          else
            cp am-hook ../../../${{ matrix.asset_name }}
            chmod +x ../../../${{ matrix.asset_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract release notes from changelogs
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          section() {
            awk -v tag="$tag" '
              /^## / { if (found) exit; if ($2 == tag) { found = 1; next } }
              found { print }
            ' "$1"
          }
          zh="$(section CHANGELOG.md)"
          en="$(section CHANGELOG.en.md)"
          download="$(awk '
            /^### / { if (found) exit; if (/Download/) found = 1 }
            found { sub(/^### /, "## "); print }
          ' .github/RELEASE_TEMPLATE.md)"
          if [ -z "$zh" ] && [ -z "$en" ]; then
            echo "::warning::No changelog section found for $tag"
          fi
          {
            if [ -n "$zh" ]; then printf '## 更新内容\n%s\n\n' "$zh"; fi
            if [ -n "$en" ]; then printf '## What'"'"'s Changed\n%s\n\n' "$en"; fi
            if [ -n "$download" ]; then printf '%s\n\n' "$download"; fi
          } > release-notes.md
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
