
<div class="page">
  <main>
    <!-- 头部（官网 artist-expression-header）：circular 圆形头像 / wide 通栏图片 / video 通栏动态视频 / no-artwork -->
    <section class="artist-hero circular" id="hero">
      <div class="artist-hero-bg" aria-hidden="true">
        <div class="artist-hero-art" id="hero-art"></div>
        <div class="artist-hero-tint"></div>
        <div class="artist-hero-blur"></div>
        <div class="artist-portrait-glow" id="portrait-glow"></div>
      </div>
      <div class="artist-portrait-wrap">
        <div class="artist-portrait" id="portrait"></div>
      </div>
      <h1 class="artist-name skeleton" id="name">&nbsp;</h1>
      <!-- 官网 artist-expression-header__logo：有艺人字标（editorialArtwork.musicContentColorLogoTrimmed）时显示透明字标图，文字名仅保留给读屏 -->
      <div class="artist-logo" id="logo" aria-hidden="true" hidden></div>
      <div class="artist-actions">
        <button class="artist-round-btn" id="info" type="button" disabled>
          <svg viewBox="0 0 39 75" fill="currentColor" aria-hidden="true"><path d="M0 70.752c0 1.954 1.709 3.516 3.809 3.516h30.713c2.148 0 3.808-1.562 3.808-3.516 0-1.904-1.66-3.418-3.808-3.418H24.317V30.616c0-2.198-1.661-3.955-3.76-3.955H4.981c-2.198 0-3.858 1.513-3.858 3.369 0 2.002 1.66 3.564 3.858 3.564h11.181v33.74H3.809c-2.1 0-3.809 1.514-3.809 3.418m18.555-57.519a6.565 6.565 0 0 0 6.592-6.592c0-3.662-2.93-6.641-6.592-6.641a6.65 6.65 0 0 0-6.641 6.641c0 3.662 2.979 6.592 6.641 6.592"/></svg>
        </button>
        <button class="artist-play-btn" id="play-all" type="button" disabled>
          <svg viewBox="0 0 72 72" aria-hidden="true"><mask id="artist-play-mask"><rect width="72" height="72" fill="#fff"/><path d="M29 24.6v22.8c0 1.5 1.6 2.4 2.9 1.7l19.3-11.4c1.3-.8 1.3-2.6 0-3.4L31.9 22.9c-1.3-.7-2.9.2-2.9 1.7Z" fill="#000"/></mask><circle cx="36" cy="36" r="36" fill="currentColor" mask="url(#artist-play-mask)"/></svg>
        </button>
        <button class="artist-round-btn" id="shuffle" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="artist-round-btn" id="disco-btn" type="button" disabled title="☁️ 一键转存全作品至 Gofile (密码保护)" aria-label="转存全作品至 Gofile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="m12 13 3-3m0 0 3 3m-3-3v8"/></svg>
        </button>
      </div>
    </section>

    <!-- 艺人全作品批量转存进度卡片 -->
    <div class="batch-progress-card" id="disco-card" hidden style="margin:16px 20px;padding:16px 20px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);backdrop-filter:blur(20px);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <span id="disco-status-title" style="font-size:14px;font-weight:600;color:var(--text);">☁️ 正在极速转存全作品至 Gofile...</span>
        <button id="disco-cancel-btn" type="button" style="border:1px solid var(--line);background:var(--surface-3);color:var(--muted);font-size:12px;padding:4px 10px;border-radius:12px;cursor:pointer;">取消</button>
      </div>
      <div style="width:100%;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-bottom:8px;">
        <div id="disco-progress-fill" style="width:0%;height:100%;background:linear-gradient(90deg,#fa2d48,#ff6b81);transition:width 0.3s ease;"></div>
      </div>
      <div id="disco-status-detail" style="font-size:12px;color:var(--muted);line-height:1.4;">准备中...</div>
    </div>

    <div class="alert info" id="alert" hidden aria-live="polite"></div>

    <!-- 官网 featured-content-and-tracks：最新发行 + 歌曲排行 -->
    <section class="artist-featured" id="featured" hidden>
      <div class="latest-wrap" id="latest-wrap" hidden>
        <h2 class="shelf-heading" id="latest-title"></h2>
        <div class="card-wrap latest-card" id="latest-card"><a class="latest" id="latest"></a></div>
      </div>
      <div class="top-songs-wrap" id="top-songs-wrap" hidden>
        <h2 class="shelf-heading top-songs-heading" id="top-songs-title"></h2>
        <div class="top-songs" id="top-songs"></div>
      </div>
    </section>

    <div id="shelves"></div>

    <section class="shelf-section artist-about" id="about" hidden>
      <h2 class="shelf-heading" id="about-title"></h2>
      <div class="artist-about-body">
        <div class="album-notes" id="bio" hidden>
          <p class="album-notes-text" id="bio-text"></p>
          <button class="album-notes-more" id="bio-more" type="button" hidden></button>
        </div>
        <dl class="artist-facts" id="facts"></dl>
      </div>
    </section>

    <!-- 官网 artist-detail-footer：在 Apple Music 中查看 -->
    <div class="artist-footer">
      <a class="artist-footer-link" id="apple-link" target="_blank" rel="noreferrer">
        <span id="apple-link-text"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
      </a>
    </div>
  </main>
</div>

<!-- 艺人全作品转存安全选项弹窗 -->
<dialog class="batch-modal" id="disco-modal" style="border:1px solid rgba(255,255,255,0.18);border-radius:18px;background:#1c1c1e;color:#ffffff;padding:0;max-width:440px;width:min(92vw,440px);box-shadow:0 24px 60px rgba(0,0,0,0.6);backdrop-filter:blur(25px);outline:none;">
  <div style="padding:22px 24px 16px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between;">
    <h3 style="margin:0;font-size:17px;font-weight:700;color:#ffffff;">☁️ 转存全作品至 Gofile (极速云端)</h3>
    <button id="disco-modal-close" type="button" style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:#a1a1a6;cursor:pointer;display:grid;place-items:center;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:14px;height:14px;"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div style="padding:20px 24px;display:flex;flex-direction:column;gap:16px;">
    <!-- 专属安全口令 -->
    <div style="display:flex;flex-direction:column;gap:6px;">
      <label style="font-size:13px;font-weight:600;color:#a1a1a6;">🔒 专属安全口令 (防误触与带宽控制)</label>
      <input type="password" id="disco-password" placeholder="请输入专属口令..." style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#ffffff;font-size:14px;outline:none;" />
    </div>

    <!-- 抓取范围卡片 -->
    <div style="padding:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:14px;display:flex;flex-direction:column;gap:12px;">
      <span style="font-size:13px;font-weight:600;color:#a1a1a6;">📚 转存作品范围</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;">
          <input type="checkbox" id="disco-include-full" checked style="accent-color:#fa2d48;width:17px;height:17px;cursor:pointer;" />
          <span style="font-size:13px;color:#ffffff;font-weight:500;">完整录音室专辑</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;">
          <input type="checkbox" id="disco-include-live" checked style="accent-color:#fa2d48;width:17px;height:17px;cursor:pointer;" />
          <span style="font-size:13px;color:#ffffff;font-weight:500;">Live 现场专辑</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;">
          <input type="checkbox" id="disco-include-singles" checked style="accent-color:#fa2d48;width:17px;height:17px;cursor:pointer;" />
          <span style="font-size:13px;color:#ffffff;font-weight:500;">单曲与 EP</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;">
          <input type="checkbox" id="disco-include-compilations" style="accent-color:#fa2d48;width:17px;height:17px;cursor:pointer;" />
          <span style="font-size:13px;color:#ffffff;font-weight:500;">精选辑</span>
        </label>
      </div>
    </div>

    <!-- 音质选项 -->
    <div style="display:flex;flex-direction:column;gap:6px;">
      <label style="font-size:13px;font-weight:600;color:#a1a1a6;">🎵 目标音质</label>
      <select id="disco-quality-select" style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#ffffff;font-size:14px;outline:none;cursor:pointer;">
        <option value="Lossless" selected style="background:#222;color:#fff;">Lossless 无损 ALAC (推荐，16/24-bit · 最佳平衡)</option>
        <option value="Hi-Res Lossless" style="background:#222;color:#fff;">Hi-Res 高解析度无损 (最高 24-bit 96/192kHz)</option>
        <option value="Dolby Atmos" style="background:#222;color:#fff;">杜比全景声 Dolby Atmos (空间音频 / EC-3)</option>
        <option value="AAC" style="background:#222;color:#fff;">高品质 AAC 256kbps (体积小，兼容性广)</option>
      </select>
    </div>

    <!-- 歌词与格式设置 -->
    <div style="padding:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:14px;display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:13px;font-weight:600;color:#a1a1a6;">📝 歌词设置</span>
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;">
        <span style="font-size:13px;color:#ffffff;font-weight:500;">内嵌歌词到音频文件 (写入 ©lyr 标签)</span>
        <input type="checkbox" id="disco-embed-lyrics" checked style="accent-color:#fa2d48;width:17px;height:17px;cursor:pointer;">
      </label>
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;">
        <span style="font-size:13px;color:#ffffff;font-weight:500;">保存独立外挂歌词文件 (.lrc)</span>
        <input type="checkbox" id="disco-save-lyrics" checked style="accent-color:#fa2d48;width:17px;height:17px;cursor:pointer;">
      </label>
    </div>
  </div>
  <div style="padding:16px 24px 20px;border-top:1px solid rgba(255,255,255,0.1);display:flex;justify-content:flex-end;gap:12px;">
    <button id="disco-modal-cancel" type="button" style="padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:#ffffff;font-size:14px;cursor:pointer;">取消</button>
    <button id="disco-modal-confirm" type="button" style="padding:8px 22px;border-radius:20px;border:none;background:#fa2d48;color:#ffffff;font-size:14px;font-weight:600;cursor:pointer;">开始一键极速转存</button>
  </div>
</dialog>
