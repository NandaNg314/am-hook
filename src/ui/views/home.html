
<div class="page">
  <main class="home">
    <section class="home-hero">
      <form class="search" id="form" novalidate>
        <label class="search-field">
          <span class="sr-only" data-i18n="home.inputLabel"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="input" type="text" enterkeyhint="search" autocomplete="off" spellcheck="false"
                 data-i18n-attr="placeholder=home.placeholder" aria-describedby="detect error"
                 role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
          <span class="detect" id="detect" aria-live="polite" hidden></span>
          <kbd class="kbd" aria-hidden="true">/</kbd>
        </label>
        <button class="btn btn-primary btn-lg" type="submit">
          <span id="submit-label" data-i18n="home.search"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
        </button>
        <div class="suggest" id="suggest" role="listbox" hidden></div>
      <div class="alert error" id="error" role="alert" hidden></div>

      <!-- Apple 深色毛玻璃风格“下载交付选项 (Options)”卡片 -->
      <section class="delivery-options-card" id="delivery-options-card">
        <div class="options-header">
          <span class="options-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </span>
          <h3 class="options-title">下载交付选项 (Options)</h3>
          <span class="options-hint">Apple Design</span>
        </div>

        <div class="options-group">
          <div class="options-group-title">交付模式切换</div>
          <div class="options-radio-group">
            <label class="apple-radio-label">
              <input type="radio" name="deliveryMode" value="local" id="mode-local" checked>
              <span class="apple-radio-custom"></span>
              <span class="radio-text">
                <strong>本地保存 (Local Storage)</strong>
                <small>浏览器解密并保存到本地</small>
              </span>
            </label>
            <label class="apple-radio-label">
              <input type="radio" name="deliveryMode" value="gofile" id="mode-gofile">
              <span class="apple-radio-custom"></span>
              <span class="radio-text">
                <strong>Gofile 纯云端转存 (Upload ZIP to Gofile & Clean VPS)</strong>
                <small>生成单 .zip 自动上传 Gofile，VPS 0 磁盘占用</small>
              </span>
            </label>
          </div>
        </div>

        <div class="options-group options-checkboxes">
          <div class="options-group-title">功能开关</div>
          <div class="options-checkbox-group">
            <label class="apple-checkbox-label">
              <input type="checkbox" id="opt-embed-metadata" checked>
              <span class="apple-checkbox-custom"></span>
              <span class="checkbox-text">写入纯净元数据 (Embed Pure Metadata)</span>
            </label>
            <label class="apple-checkbox-label">
              <input type="checkbox" id="opt-download-lrc" checked>
              <span class="apple-checkbox-custom"></span>
              <span class="checkbox-text">下载配套同步歌词 (.lrc)</span>
            </label>
          </div>
        </div>
      </section>
      <p class="examples">
        <span data-i18n="home.example"></span>
        <button class="example" type="button" data-example="https://music.apple.com/us/song/cruel-summer/1468058171"><b data-i18n="home.detectSong"></b>Cruel Summer</button>
        <button class="example" type="button" data-example="https://music.apple.com/us/music-video/born-again-feat-doja-cat-raye/1794822079"><b data-i18n="home.detectMv"></b>Born Again</button>
        <button class="example" type="button" data-example="https://music.apple.com/us/album/justice-triple-chucks-deluxe-deluxe-video-version/1561058084"><b data-i18n="home.detectAlbum"></b>Justice</button>
        <button class="example" type="button" data-example="https://music.apple.com/us/artist/lisa/1583908668"><b data-i18n="home.detectArtist"></b>LISA</button>
        <button class="example" type="button" data-example="https://music.apple.com/us/playlist/top-100-global/pl.d25f5d1181894928af76c85c967f8f31"><b data-i18n="home.detectPlaylist"></b>Top 100: Global</button>
      </p>      </section>

    <section class="results" id="results" aria-live="polite" hidden>
      <div class="section-head">
        <h2 class="section-title" id="results-title"></h2>
        <div class="results-tools">
          <button class="storefront" id="storefront" type="button" data-picker="storefront" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker">
            <span class="storefront-caption" data-i18n="search.storefront"></span>
            <span class="storefront-value" data-setting-value="storefront"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button class="link-btn" id="close-results" type="button" data-i18n="search.close"></button>
        </div>
      </div>
      <div class="results-tabs" id="results-tabs" role="tablist" hidden></div>
      <div id="results-body"></div>
    </section>

    <section class="recent" id="recent" hidden>
      <div class="section-head">
        <h2 class="section-title" data-i18n="home.recent"></h2>
        <button class="link-btn" id="clear-recent" type="button" data-i18n="home.clear"></button>
      </div>
      <ul class="recent-list" id="recent-list"></ul>
    </section>

    <ul class="formats">
      <li class="format" style="--tint: #fb2c55"><span class="format-tag" data-i18n="q.lossless"></span><strong>ALAC</strong><span data-i18n="home.fmtAlac"></span></li>
      <li class="format" style="--tint: #8b6cf6"><span class="format-tag" data-i18n="home.tagAtmos"></span><strong>Dolby Atmos</strong><span data-i18n="home.fmtAtmos"></span></li>
      <li class="format" style="--tint: #e8931c"><span class="format-tag" data-i18n="home.tagAac"></span><strong>AAC</strong><span data-i18n="home.fmtAac"></span></li>
      <li class="format" style="--tint: #19a7a0"><span class="format-tag" data-i18n="home.tagMv"></span><strong>Music Video</strong><span data-i18n="home.fmtMv"></span></li>
    </ul>
  </main>

  <footer class="footer home-footer">
    <div class="footer-row">
      <span data-i18n="footer.tagline"></span>
      <span data-i18n="footer.note"></span>
      <a class="footer-github" href="https://github.com/itouakirai/am-hook" target="_blank" rel="noopener noreferrer">

        <span data-i18n="footer.github"></span>
      </a>
    </div>
    <p class="footer-credits">
      <span data-i18n="footer.thanks"></span>
      <a href="https://github.com/WorldObservationLog/wrapper" target="_blank" rel="noopener noreferrer">wrapper-lite</a>
      <a href="https://github.com/amll-dev/applemusic-like-lyrics" target="_blank" rel="noopener noreferrer">AMLL</a>
      <a href="https://github.com/WorldObservationLog/Temari" target="_blank" rel="noopener noreferrer">Temari</a>
      <a href="https://github.com/itouakirai/apple-music-downloader" target="_blank" rel="noopener noreferrer">apple-music-downloader</a>
      <a href="https://github.com/Eyevinn/mp4ff" target="_blank" rel="noopener noreferrer">mp4ff</a>
      <a href="https://github.com/video-dev/hls.js" target="_blank" rel="noopener noreferrer">hls.js</a>
      <a href="https://github.com/Vanilagy/mediabunny" target="_blank" rel="noopener noreferrer">Mediabunny</a>
    </p>
  </footer>
</div>
